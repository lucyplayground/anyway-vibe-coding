<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인터랙티브 차트 대시보드</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <main class="dashboard">
      <header class="page-header">
        <p class="eyebrow">TUTORIAL 02 · CHART.JS</p>
        <h1>인터랙티브 차트 대시보드</h1>
        <p class="description">막대 차트와 꺾은선 차트로 데이터를 살펴보세요.</p>
      </header>

      <p id="chart-error" class="error" role="alert" hidden>
        차트를 불러오지 못했습니다. 인터넷 연결을 확인하고 페이지를 새로고침해 주세요.
      </p>
      <noscript><p class="error">차트를 표시하려면 JavaScript를 활성화해 주세요.</p></noscript>

      <div class="chart-grid">
        <section class="chart-card" aria-labelledby="bar-title">
          <h2 id="bar-title">막대 차트</h2>
          <p class="chart-description">항목별 데이터를 비교합니다.</p>
          <div class="chart-container">
            <canvas id="bar-chart" role="img" aria-label="막대 차트. 아직 데이터가 없습니다.">
              아직 데이터가 없는 막대 차트입니다.
            </canvas>
          </div>
          <p class="empty-state">아직 데이터가 없습니다.</p>
        </section>

        <section class="chart-card" aria-labelledby="line-title">
          <h2 id="line-title">꺾은선 차트</h2>
          <p class="chart-description">데이터의 변화 흐름을 살펴봅니다.</p>
          <div class="chart-container">
            <canvas id="line-chart" role="img" aria-label="꺾은선 차트. 아직 데이터가 없습니다.">
              아직 데이터가 없는 꺾은선 차트입니다.
            </canvas>
          </div>
          <p class="empty-state">아직 데이터가 없습니다.</p>
        </section>
      </div>
    </main>
  </body>
</html>
