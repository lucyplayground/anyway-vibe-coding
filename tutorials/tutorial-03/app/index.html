<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>컬러 팔레트 생성기</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="palette-app">
      <header class="page-header">
        <p class="eyebrow">COLOR PALETTE</p>
        <h1>컬러 팔레트 생성기</h1>
        <p class="description">떠오르는 단어로 새로운 색의 조합을 만나보세요.</p>
      </header>

      <section class="workspace" aria-label="팔레트 만들기">
        <label for="keyword">어떤 색이 떠오르나요?</label>
        <div class="input-row">
          <input
            id="keyword"
            name="keyword"
            type="text"
            placeholder="예: 노을, 숲, 여름 바다"
            autocomplete="off"
          />
          <div class="button-group">
            <button type="button">생성</button>
            <button type="button" class="shuffle-button">셔플</button>
          </div>
        </div>

        <section class="palette-section" aria-labelledby="palette-title">
          <div class="section-header">
            <h2 id="palette-title">컬러 팔레트</h2>
            <p>색상이 표시될 공간</p>
          </div>
          <div class="palette-output" role="region" aria-label="생성된 색상"></div>
        </section>
      </section>
    </main>
  </body>
</html>
