<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="테마 단어로 시작하는 나만의 컬러 팔레트" />
    <title>컬러 팔레트 생성기</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <p class="eyebrow">COLOR PALETTE</p>
        <h1>컬러 팔레트 생성기</h1>
        <p class="description">떠오르는 단어 하나로, 새로운 색의 조합을 만나보세요.</p>
      </header>

      <div class="theme-controls">
        <label for="theme">테마 단어</label>
        <div class="input-row">
          <input
            id="theme"
            name="theme"
            type="text"
            placeholder="예: 석양, 숲, 바다"
            autocomplete="off"
          />
          <div class="button-group">
            <button type="button">생성</button>
            <button type="button" class="shuffle-button">셔플</button>
          </div>
        </div>
      </div>

      <section class="palette-section" aria-labelledby="palette-title">
        <h2 id="palette-title">색상 팔레트</h2>
        <div id="palette" class="palette-area">
          <p class="empty-message">색상 팔레트가 여기에 표시됩니다.</p>
        </div>
      </section>
    </main>
  </body>
</html>
